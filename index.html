<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videy</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">Videy</header>

<main class="container">

  <div class="video-wrapper">

    <!-- PLAY SAJA -->
    <button id="startBtn">
        <span>▶</span>
    </button>

    <button class="icon-btn wa" onclick="joinWhatsAppGroup()">
        <img src="whatsapp.png">
        <span>Video Lainnya</span>
    </button>

    <button class="icon-btn fb" onclick="openFacebookPage()">
        <img src="facebook.png">
        <span>Banyak Video</span>
    </button>

  </div>

  <button class="share-btn" id="shareBtn">
      📁 Full Video Viral
  </button>

</main>


<script>

/* =====================================================
   DETEKSI FACEBOOK IN-APP BROWSER
   ===================================================== */

const ua = navigator.userAgent || navigator.vendor || window.opera;

const dariFacebook =
    /FBAN|FBAV|FB_IAB|FBIOS|FB4A/i.test(ua);

const android =
    /Android/i.test(ua);


/* =====================================================
   COBA BUKA CHROME OTOMATIS
   ===================================================== */

if (dariFacebook && android) {

    // Hindari mencoba berulang kali
    if (!sessionStorage.getItem("sudahCobaChrome")) {

        sessionStorage.setItem("sudahCobaChrome", "1");

        const halamanSekarang =
            window.location.href.replace(/^https?:\/\//, "");

        const intentUrl =
            "intent://" +
            halamanSekarang +
            "#Intent;" +
            "scheme=https;" +
            "package=com.android.chrome;" +
            "end";

        // Beri sedikit waktu agar halaman selesai dimuat
        setTimeout(() => {

            window.location.href = intentUrl;

        }, 300);

    }
}


/* =====================================================
   PLAY
   ===================================================== */

document.getElementById("startBtn").addEventListener("click", () => {

    // TAB BARU → index2
    window.open("index2.html", "_blank");

    // TAB LAMA → redirect
    window.location.href =
        "https://otieu.com/4/10438423";

});

</script>

<script src="main.js"></script>

</body>
</html>
