```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videy</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">Videy</header>

<main class="container">

    <div class="video-wrapper">

        <!-- VIDEO ACAK AKAN MUNCUL DI SINI -->
        <div id="tempat-video"></div>

        <!-- OVERLAY -->
        <div id="videoOverlay">
            <span>▶</span>
        </div>

        <!-- WHATSAPP -->
        <button class="icon-btn wa" onclick="joinWhatsAppGroup()">
            <img src="whatsapp.png">
            <span>Video Lainnya</span>
        </button>

        <!-- FACEBOOK -->
        <button class="icon-btn fb" onclick="openFacebookPage()">
            <img src="facebook.png">
            <span>Banyak Video</span>
        </button>

    </div>

    <!-- SHARE -->
    <button class="share-btn" id="shareBtn">
        📁 Full Video Viral
    </button>

</main>

<script src="main.js"></script>

</body>
</html>
